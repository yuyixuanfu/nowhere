[project]
name = "nowhere-mcp"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2,<3", "httpx>=0.27,<1", "numpy>=1.26,<3", "timezonefinder>=6.2,<7", "uvicorn>=0.27,<1", "opencc-python-reimplemented>=0.1.7,<1", "ephem>=4.1,<5", "tzdata>=2024.1,<2026"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]
build = ["scipy>=1.12,<2"]

[project.scripts]
nowhere = "nowhere.server:main"
nowhere-mcp = "nowhere.server:main"

[tool.setuptools.packages.find]
include = ["nowhere*"]

[tool.setuptools.package-data]
nowhere = ["data/*", "data/offline/*", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
